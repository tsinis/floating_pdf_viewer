name: floating_pdf_viewer
description: "A Flutter package that provides a draggable, resizable floating PDF viewer widget with zoom controls and overlay support."
version: 0.1.8
homepage: https://github.com/raphaelbarbosaqwerty/floating_pdf_viewer
repository: https://github.com/tsinis/floating_pdf_viewer

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  pdfx: ^2.11.0
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

